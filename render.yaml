services:
  - type: web
    name: abr-crm-api
    runtime: node
    rootDir: abr-crm
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm run api:start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AUTH_SIGNING_SECRET
        generateValue: true
      - key: API_ADMIN_TOKEN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: ALLOWED_EXTENSION_IDS
        sync: false
      - key: ABR_TEST_CUSTOMER_PHONE
        sync: false
      - key: ABR_TEST_DESTINATION_PHONE
        sync: false
      - key: ABR_TEST_DESTINATION_NAME
        sync: false
