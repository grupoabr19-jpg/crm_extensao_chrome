<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABR CRM - Funis</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;letter-spacing:0}
    .app{height:100vh;display:grid;grid-template-columns:76px 1fr}
    .rail{background:#253575;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 10px;gap:14px}
    .logo{width:46px;height:46px;border-radius:23px;background:#fff;color:#253575;display:grid;place-items:center;font-weight:800;font-size:13px}
    .rail button{width:46px;height:46px;border:0;border-radius:12px;background:#33458f;color:#fff;font-size:20px;cursor:pointer}.rail button.active{background:#f08700}
    .main{min-width:0;display:flex;flex-direction:column}
    header{height:68px;background:#fff;border-bottom:1px solid #dde3ee;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
    h1{font-size:20px;margin:0;color:#253575}.sub{font-size:12px;color:#667085;margin-top:3px}
    .tools{display:flex;gap:10px;align-items:center}select,input,textarea{border:1px solid #cfd7e6;border-radius:8px;padding:9px;background:#fff;color:#111}textarea{width:100%;min-height:70px;resize:vertical}button{border:0;border-radius:8px;background:#f08700;color:#fff;padding:10px 12px;cursor:pointer}button.secondary{background:#e9edf6;color:#253575}button.danger{background:#9f2d20}
    .status{font-size:12px;color:#253575;min-width:180px;text-align:right}.board{flex:1;overflow:auto;padding:18px;display:flex;gap:14px;align-items:stretch}
    .col{min-width:282px;width:282px;background:#eef2f7;border:1px solid #dde3ee;border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 104px)}
    .colHead{padding:12px;border-bottom:1px solid #dce3ee;display:flex;align-items:center;justify-content:space-between}.colHead b{font-size:13px;color:#253575}.count{font-size:11px;background:#fff;color:#253575;border-radius:999px;padding:3px 7px}
    .cards{padding:10px;overflow:auto;flex:1;display:grid;align-content:start;gap:9px}.cards.dragover{outline:2px solid #f08700;outline-offset:-5px}
    .card{background:#fff;border:1px solid #d9e0ec;border-radius:9px;padding:10px;box-shadow:0 1px 2px #0000000d;cursor:grab}.card:active{cursor:grabbing}.card b{display:block;font-size:13px;color:#172033;margin-bottom:5px}
    .line{font-size:11px;color:#5b667a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;border-radius:999px;padding:3px 6px;background:#eef1f8;color:#253575}.tag.hot{background:#fff1e3;color:#9a4d00}.tag.status{background:#e9f8ef;color:#146c3b;min-width:auto;text-align:left}
    .empty{font-size:12px;color:#667085;padding:10px}.drawer{position:fixed;right:0;top:0;width:430px;max-width:100vw;height:100vh;background:#fff;border-left:1px solid #d8deea;box-shadow:-12px 0 30px #0002;display:none;flex-direction:column}.drawer.open{display:flex}.drawer header{height:auto;display:block;padding:18px}.drawerBody{padding:0 18px 18px;overflow:auto}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px;margin:8px 0}.kv span:first-child{color:#667085}.close{position:absolute;top:12px;right:12px}.panel{border-top:1px solid #edf0f5;margin-top:14px;padding-top:12px}.panel h2{font-size:13px;color:#253575;margin:0 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.kpis{display:flex;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid #dde3ee}.kpi{border:1px solid #e0e5ee;border-radius:8px;padding:8px 10px;min-width:110px}.kpi b{display:block;color:#253575}.kpi span{font-size:11px;color:#667085}
  </style>
</head>
<body>
  <div class="app">
    <nav class="rail">
      <div class="logo">ABR</div>
      <button class="active" title="Funis">▦</button>
      <button title="Atendimentos">☰</button>
      <button title="Relatorios">◷</button>
      <div style="flex:1"></div>
      <button title="Atualizar" id="railRefresh">↻</button>
    </nav>
    <main class="main">
      <header>
        <div><h1>Funis CRM</h1><div class="sub">Kanban operacional para leads, etapas e handoffs do Grupo ABR</div></div>
        <div class="tools">
          <select id="funnel"></select>
          <input id="search" placeholder="Buscar lead, protocolo, cidade">
          <button class="secondary" id="kpiBtn">KPIs</button>
          <button class="secondary" id="exportBtn">Exportar CSV</button>
          <button class="secondary" id="refresh">Atualizar</button>
          <span class="status" id="status">Carregando...</span>
        </div>
      </header>
      <section class="kpis" id="kpis"></section>
      <section class="board" id="board"></section>
    </main>
  </div>
  <aside class="drawer" id="drawer">
    <button class="secondary close" id="close">Fechar</button>
    <header><h1 id="dTitle">Lead</h1><div class="sub" id="dSub"></div></header>
    <div class="drawerBody" id="drawerBody"></div>
  </aside>
  <script>
    const api = location.origin;
    const state = { funnels: [], board: null, active: null, dragged: null, query: "", selected: null };
    const $ = (id) => document.getElementById(id);
    const say = (m) => $('status').textContent = m;
    async function json(path, opts) {
      const res = await fetch(api + path, Object.assign({ headers: { 'content-type': 'application/json' } }, opts || {}));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }
    function cardMatches(card) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return JSON.stringify(card).toLowerCase().includes(q);
    }
    function renderFunnels() {
      $('funnel').innerHTML = state.funnels.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
      if (state.active) $('funnel').value = state.active;
    }
    function renderBoard() {
      if (!state.board || !state.board.funnel) {
        $('board').innerHTML = '<div class="empty">Nenhum funil configurado.</div>';
        return;
      }
      $('board').innerHTML = state.board.columns.map(col => {
        const cards = (col.cards || []).filter(cardMatches);
        return `<section class="col" data-stage="${col.id}">
          <div class="colHead"><b>${escapeHtml(col.name)}</b><span class="count">${cards.length}</span></div>
          <div class="cards" data-stage="${col.id}">
            ${cards.map(renderCard).join('') || '<div class="empty">Sem leads nesta etapa.</div>'}
          </div>
        </section>`;
      }).join('');
      document.querySelectorAll('.card').forEach(el => {
        el.addEventListener('dragstart', () => state.dragged = el.dataset.caseId);
        el.addEventListener('click', () => openCard(findCard(el.dataset.caseId)));
      });
      document.querySelectorAll('.cards').forEach(zone => {
        zone.addEventListener('dragover', ev => { ev.preventDefault(); zone.classList.add('dragover'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
        zone.addEventListener('drop', async ev => {
          ev.preventDefault();
          zone.classList.remove('dragover');
          if (!state.dragged) return;
          await moveCard(state.dragged, zone.dataset.stage);
        });
      });
    }
    function renderCard(card) {
      const name = card.contact?.name || card.contact?.phone || 'Lead sem nome';
      const f = card.fields || {};
      return `<article class="card" draggable="true" data-case-id="${card.id}">
        <b>${escapeHtml(name)}</b>
        <div class="line">${escapeHtml(card.protocol || '')} · ${escapeHtml(card.status || '')}</div>
        <div class="line">${escapeHtml(f.city || '')}${f.uf ? '/' + escapeHtml(f.uf) : ''} · ${escapeHtml(f.segment || 'Sem segmento')}</div>
        <div class="line">${escapeHtml(f.need || 'Sem resumo')}</div>
        <div class="tags"><span class="tag status">${escapeHtml(f.stage || 'Etapa')}</span><span class="tag hot">${escapeHtml(f.temperature || 'Temp.')}</span><span class="tag">${escapeHtml(f.potential || 'Potencial')}</span></div>
      </article>`;
    }
    function findCard(id) {
      for (const col of state.board.columns) {
        const card = (col.cards || []).find(c => c.id === id);
        if (card) return card;
      }
      return null;
    }
    function openCard(card) {
      if (!card) return;
      state.selected = card;
      const f = card.fields || {};
      $('dTitle').textContent = card.contact?.name || card.contact?.phone || 'Lead';
      $('dSub').textContent = `${card.protocol || ''} · ${card.status || ''}`;
      $('drawerBody').innerHTML = [
        ['Telefone', card.contact?.phone],
        ['Empresa', f.company],
        ['Cidade/UF', [f.city, f.uf].filter(Boolean).join('/')],
        ['Segmento', f.segment],
        ['Funil', f.pipeline],
        ['Etapa', f.stage],
        ['Potencial', f.potential],
        ['Temperatura', f.temperature],
        ['Origem', f.source],
        ['Responsavel', card.owner?.name],
        ['WhatsApp resp.', card.owner?.phone],
        ['Necessidade', f.need]
      ].map(([k,v]) => `<div class="kv"><span>${escapeHtml(k)}</span><span>${escapeHtml(v || '-')}</span></div>`).join('') +
      `<div class="panel"><h2>Follow-up</h2><div class="row"><input id="taskTitle" placeholder="Tarefa"><input id="taskDue" type="datetime-local"></div><div class="actions"><button id="addTask">Agendar</button></div></div>
       <div class="panel"><h2>Nota interna</h2><textarea id="noteBody" placeholder="Nao vai para o WhatsApp"></textarea><div class="actions"><button id="addNote" class="secondary">Salvar nota</button></div></div>
       <div class="panel"><h2>Transferir</h2><div class="row"><input id="transferName" placeholder="Novo responsavel"><input id="transferPhone" placeholder="+5511999990001"></div><div class="actions"><button id="transferLead" class="secondary">Criar transferencia</button><button id="queueMessage" class="secondary">Preparar mensagem</button></div></div>
       <div class="panel"><h2>Fechamento</h2><div class="row"><input id="saleValue" placeholder="Valor venda"><select id="lossReason"><option>Preco</option><option>Disponibilidade de Estoque</option><option>Condicao de Pagamento</option><option>Logistica</option><option>Outro</option></select></div><input id="lossDetail" placeholder="Detalhe perda, se houver" style="width:100%;margin-top:8px"><div class="actions"><button id="markWon">Venda ganha</button><button id="markLost" class="danger">Venda perdida</button></div></div>`;
      $('drawer').classList.add('open');
      $('addTask').onclick = addTask;
      $('addNote').onclick = addNote;
      $('transferLead').onclick = transferLead;
      $('queueMessage').onclick = queueMessage;
      $('markWon').onclick = () => closeLead('won');
      $('markLost').onclick = () => closeLead('lost');
    }
    async function moveCard(caseId, stageId) {
      say('Movendo lead...');
      await json(`/v1/cases/${encodeURIComponent(caseId)}/stage`, { method: 'POST', body: JSON.stringify({ stageId }) });
      await loadBoard();
      say('Lead movido.');
    }
    async function addTask() {
      if (!state.selected) return;
      await json(`/v1/cases/${encodeURIComponent(state.selected.id)}/tasks`, { method: 'POST', body: JSON.stringify({ title: $('taskTitle').value || 'Follow-up', dueAt: $('taskDue').value || null }) });
      say('Follow-up agendado.');
    }
    async function addNote() {
      if (!state.selected) return;
      await json(`/v1/cases/${encodeURIComponent(state.selected.id)}/notes`, { method: 'POST', body: JSON.stringify({ body: $('noteBody').value }) });
      say('Nota salva.');
    }
    async function transferLead() {
      if (!state.selected) return;
      const data = await json(`/v1/cases/${encodeURIComponent(state.selected.id)}/transfer`, { method: 'POST', body: JSON.stringify({ responsibleName: $('transferName').value, responsiblePhone: $('transferPhone').value, department: state.selected.fields?.department || 'Vendas' }) });
      await navigator.clipboard?.writeText(data.handoff.message).catch(() => {});
      say('Transferencia criada e mensagem copiada.');
      await loadBoard();
    }
    async function queueMessage() {
      if (!state.selected) return;
      const data = await json(`/v1/cases/${encodeURIComponent(state.selected.id)}/outbox/handoff-message`, { method: 'POST', body: '{}' });
      await navigator.clipboard?.writeText(data.command.payload.message).catch(() => {});
      say('Mensagem aprovada criada no outbox e copiada.');
    }
    async function closeLead(outcome) {
      if (!state.selected) return;
      await json(`/v1/cases/${encodeURIComponent(state.selected.id)}/close`, { method: 'POST', body: JSON.stringify({ outcome, saleValue: $('saleValue').value || null, lossReason: $('lossReason').value, lossDetail: $('lossDetail').value }) });
      $('drawer').classList.remove('open');
      await loadBoard();
      await loadKpis();
      say(outcome === 'won' ? 'Venda ganha registrada.' : 'Venda perdida registrada.');
    }
    async function loadKpis() {
      const data = await json('/v1/reports/kpis');
      const t = data.totals || {}, h = data.handoffs || {}, tasks = data.tasks || {};
      $('kpis').innerHTML = [
        ['Atendimentos', t.cases || 0],
        ['Ganhos', t.won || 0],
        ['Perdidos', t.lost || 0],
        ['Encaminhados', h.total || 0],
        ['Assumidos', h.claimed || 0],
        ['Follow-ups abertos', tasks.open || 0]
      ].map(([label,value]) => `<div class="kpi"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`).join('');
    }
    async function loadFunnels() {
      say('Carregando funis...');
      const data = await json('/v1/funnels');
      state.funnels = data.items || [];
      const preferred = state.funnels.find(f => f.name === 'VAREJO') || state.funnels.find(f => (f.stages || []).length) || state.funnels[0];
      state.active = state.active || preferred?.id || null;
      renderFunnels();
    }
    async function loadBoard() {
      if (!state.active) return;
      say('Carregando Kanban...');
      state.board = await json(`/v1/funnels/${encodeURIComponent(state.active)}/board`);
      renderBoard();
      say('Atualizado.');
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    $('funnel').onchange = async () => { state.active = $('funnel').value; await loadBoard(); };
    $('refresh').onclick = async () => { await loadFunnels(); await loadBoard(); };
    $('railRefresh').onclick = $('refresh').onclick;
    $('kpiBtn').onclick = loadKpis;
    $('exportBtn').onclick = () => { location.href = api + '/v1/reports/cases.csv'; };
    $('search').oninput = () => { state.query = $('search').value; renderBoard(); };
    $('close').onclick = () => $('drawer').classList.remove('open');
    loadFunnels().then(loadBoard).then(loadKpis).catch(err => say('Erro: ' + err.message));
  </script>
</body>
</html>
